[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maomi-optics-preview"
version = "0.5.0.dev0"
description = "MAOMi: accelerated optical simulation with open PSF interfaces and procedural ground truth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "torch>=2.5"]
license = {file = "LICENSE"}

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13,<15"]
tissue = ["numba>=0.61"]
io = ["tifffile>=2024", "astropy>=6", "imageio-ffmpeg>=0.5"]
reproduce = ["h5py>=3.10", "matplotlib>=3.8"]
optics = ["rayoptics==0.9.5"]
examples = ["matplotlib>=3.8"]

[project.scripts]
maomi-fixed = "maomi.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/NAOMi-MIT.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["maomi*"]

[tool.setuptools.package-data]
"maomi.backends.cuda" = ["*.cu"]
