name: Public package checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      MAOMI_STATUS_WINDOW: '0'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[optics,examples,mat,tissue]"
      - run: python -m pip check
      - name: Trace a PSF from the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from importlib.metadata import version;
          from maomi.integrations.rayoptics import demo_lens, rayoptics_psf;
          psf = rayoptics_psf(demo_lens(), num_rays=9, fft_size=32);
          print({'rayoptics': version('rayoptics'), 'opticalglass': version('opticalglass'), 'shape': psf.intensity.shape});
          assert psf.intensity.shape == (32, 32)"
      - run: python -m unittest discover -s tests -v
      - run: python -m maomi run --config examples/scene.json --output artifacts/ci_scene --max-frames 3
      - run: python -m maomi resume artifacts/ci_scene
      - run: python -m maomi run --demo --config examples/timed_acquisition.json --output artifacts/ci_timed --max-frames 3
      - run: python -m maomi resume artifacts/ci_timed
      - run: python -m maomi run --demo --config examples/timed_acquisition.json --rana --output artifacts/ci_timed_rana --max-frames 3
      - run: python -m maomi resume artifacts/ci_timed_rana
      - run: python examples/rayoptics_movie.py --output artifacts/ci_rayoptics_movie
      - run: python examples/rana_movie.py --rana --output artifacts/ci_rana_movie
      - run: python examples/rana_movie.py --rana --physics --nuclear --output artifacts/ci_rana_physics_movie
      - run: python examples/spatial_psf.py --output artifacts/ci_psf
      - run: python tools/verify_psf_field.py --folder artifacts/ci_psf
      - run: python examples/rayoptics_custom_psf.py --output artifacts/ci_rayoptics
      - run: python tools/verify_platform_demo.py --folder artifacts/ci_rayoptics
      - run: python examples/enhanced_full_field.py --no-status-window --output artifacts/ci_enhanced
      - run: python -m maomi render --demo --rana --device cpu --no-status-window --output artifacts/ci_rana
      - run: python -m maomi run --demo --config examples/rana_physics.json --rana --output artifacts/ci_physics
      - run: python examples/custom_rana_provider.py --output artifacts/ci_custom_bank.npz
      - run: maomi render --demo --device cpu --rana --psf-field artifacts/ci_custom_bank.npz --output artifacts/ci_custom_static
      - run: maomi run --demo --device cpu --rana --psf-field artifacts/ci_custom_bank.npz --output artifacts/ci_custom_movie --max-frames 3
      - run: maomi resume artifacts/ci_custom_movie
      - name: Installed shared CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: maomi render --demo --rana --device cpu --no-status-window --output rana_installed
