name: Public package checks
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[optics,examples]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/spatial_psf.py --output artifacts/ci_psf
      - run: python tools/verify_psf_field.py --folder artifacts/ci_psf
